name: Update dashboard data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch market data
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: python fetch.py
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_attempt }}
