name: Update dashboard data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch market data
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: python fetch.py
      - name: Record forward performance
        run: |
          git fetch origin main
          if git cat-file -e origin/main:ledger.json; then git show origin/main:ledger.json > ledger.json; fi
          node record.cjs
          git config user.name "Dashboard recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Record observed market signals [skip ci]"
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_attempt }}
